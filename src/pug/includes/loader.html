<style>
    .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }


    .loader__inner {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .loader__inner img {
        width: 100px;
        height: auto;
    }

    .loader svg {
        -webkit-animation: heartbeat 1.5s ease-in-out infinite both;
        animation: heartbeat 1.5s ease-in-out infinite both;
    }

    @keyframes heartbeat {
        from {
            -webkit-transform: scale(1);
                    transform: scale(1);
            -webkit-transform-origin: center center;
                    transform-origin: center center;
            -webkit-animation-timing-function: ease-out;
                    animation-timing-function: ease-out;
        }
        10% {
            -webkit-transform: scale(0.91);
                    transform: scale(0.91);
            -webkit-animation-timing-function: ease-in;
                    animation-timing-function: ease-in;
        }
        17% {
            -webkit-transform: scale(0.98);
                    transform: scale(0.98);
            -webkit-animation-timing-function: ease-out;
                    animation-timing-function: ease-out;
        }
        33% {
            -webkit-transform: scale(0.87);
                    transform: scale(0.87);
            -webkit-animation-timing-function: ease-in;
                    animation-timing-function: ease-in;
        }
        45% {
            -webkit-transform: scale(1);
                    transform: scale(1);
            -webkit-animation-timing-function: ease-out;
                    animation-timing-function: ease-out;
        }
    }


    .loader__inner p {
        font-size: 20px;
        font-weight: 700;
        color: #000;
        margin-top: 20px;
    }
</style>

    .header>*,
    .breadcrumbs,
    .inner-page-head__title,
    .inner-page-head__decor,
    .inner-page-head__subtitle {
        opacity: 0;
    }
</style>

<script>
    function revealWithoutPreloader() {
        const s = document.querySelector('style[data-inner-page-loader-styles]');
        if (s) s.remove();
        const l = document.querySelector('.loader');
        if (l) l.remove();
    }

    window.addEventListener('DOMContentLoaded', () => {
        const headerLogo = document.querySelector('.header__logo-wrap');

        if (typeof gsap === 'undefined' || !headerLogo) {
            revealWithoutPreloader();
            return;
        }

        const { y, x } = headerLogo.getBoundingClientRect();
        const loaderWidth = document.querySelector('.loader svg').getBoundingClientRect().width;
        const headerLogoWidth = headerLogo.getBoundingClientRect().width;
        const scaleFactor = headerLogoWidth / loaderWidth;
                    
        console.log(headerLogo.getBoundingClientRect());
        
        window.prelaoderTl = gsap.timeline({
            paused: true
        })
            .add(() => {
                document.querySelector('style[data-inner-page-loader-styles]').remove();
            })
            .fromTo('.loader svg', {
                y: 0,
                x: 0,
                // scale: 1
                // opacity: 1
            }, {
                y: () => {
                    const loaderY = document.querySelector('.loader svg').getBoundingClientRect().y;
                    return (loaderY - y) * -1;
                },
                x: () => {
                    const loaderX = document.querySelector('.loader svg').getBoundingClientRect().x;
                    return (loaderX - x) * -1;
                },
                scale: scaleFactor,
                // opacity: 0,
                transformOrigin: 'top left',
                duration: 1.25,
                ease: 'power4.out'
            })
            .fromTo('.loader', {
                // opacity: 1,
                clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
                opacity: 1
            }, {
                // opacity: 0,
                clipPath: 'polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)',
                duration: 1.25,
                opacity: 0,
                ease: 'power4.out',
                onComplete: () => {
                    document.querySelector('.loader').style.display = 'none';
                }
            },'<+10%')
            
            .fromTo('.header>*:not(.header__logo-wrap)', {
                y: -50,
                opacity: 0
            }, { 
                y: 0,
                opacity: 1,
                duration: 1,
                stagger: 0.1,
                ease: 'power4.out',
                clearProps: 'all'
            }, '<+20%')
            .fromTo(`
                .breadcrumbs, .inner-page-head__title, .inner-page-head__decor, .inner-page-head__subtitle, .inner-page-head~div
            `, {
                opacity: 0,
                y: 50
            }, {
                opacity: 1,
                y: 0,
                duration: 1,
                stagger: 0.1,
                ease: 'power4.out',
                clearProps: 'all'
            }, '<')
            .set('.loader', {
                display: 'none'
            })
            .add(() => {
                document.querySelector('.loader').remove();
            })
            ;
    });
    window.addEventListener('load', () => {
        if (window.prelaoderTl) window.prelaoderTl.play();
        else revealWithoutPreloader();
    });

</script>
